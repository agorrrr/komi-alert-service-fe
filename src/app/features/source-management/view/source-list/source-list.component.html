<div class="flex flex-column gap-3">
 
  <app-table-helper-lazy [acl]="permissions"
                         [data]="sources"
                         [objectName]="headerName"
    
                         [totalRecord]="paginationData.totalRecord"
                         [fields]="fields"
                         [loadingData]="isLoading"
                         [enableFilter]="false"
                         (addEvent)="onAdd()"
                         (updateEvent)="onUpdate($event)"
                         (viewEvent)="onView($event)"
                         (deleteEvent)="onDelete($event)"
                         (paggingEvent)="onPaging($event)">
  </app-table-helper-lazy>
</div>

<p-dialog [header]="isCreation ? 'Create Source' : (isView ? 'View Source' : 'Edit Source')"
          [(visible)]="modalVisibility"
          [modal]="true"
          [style]="{ width: '50vw' }"
          [draggable]="false"
          [resizable]="false"
          (onHide)="onSuccess()">
  <app-source-form *ngIf="modalVisibility" 
                   (successEvent)="onSuccess()" 
                   (cancelEvent)="modalVisibility = false">
  </app-source-form>
</p-dialog>
