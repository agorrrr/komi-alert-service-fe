<form [formGroup]="formGroup" (ngSubmit)="onSubmit()" *ngIf="formGroup">
  <div class="p-fluid">
    <!-- Mode Selection (only show in creation mode) -->
    <div class="field" *ngIf="isCreationMode">
      <label class="block text-900 font-medium">Import Mode</label>
      <div class="flex gap-3">
        <div class="field-radiobutton">
          <p-radioButton
            formControlName="mode"
            value="SINGLE"
            (onClick)="onModeChange(false)">
          </p-radioButton>
          <label class="ml-2">Single Account</label>
        </div>
        <div class="field-radiobutton">
          <p-radioButton
            formControlName="mode"
            value="BULK"
            (onClick)="onModeChange(true)">
          </p-radioButton>
          <label class="ml-2">Bulk Import</label>
        </div>
      </div>
    </div>

    <!-- Single Account Input -->
    <div class="field" *ngIf="!isBulkMode">
      <label for="newAccountNo" class="block text-900 font-medium mb-2">
        Account Number <span class="text-red-500">*</span>
      </label>
      <input
        pInputText
        appOnlyNumber
        id="newAccountNo"
        formControlName="newAccountNo"
        placeholder="Enter account number"
        [class]="{'ng-invalid ng-dirty': formGroup.get('newAccountNo')?.invalid && formGroup.get('newAccountNo')?.touched}">
      <small
        class="p-error block"
        *ngIf="formGroup.get('newAccountNo')?.invalid && formGroup.get('newAccountNo')?.touched">
        Account number is required
      </small>
    </div>

    <!-- Bulk File Upload -->
    <div class="flex flex-column justify-content-start align-items-start" *ngIf="isBulkMode && isCreationMode">
      <label class="block text-900 font-medium mb-2">
        Upload File <span class="text-red-500">*</span>
      </label>
      <p-fileupload
        #fileUpload
        mode="basic"
        name="blacklistFile"
        [accept]="acceptedFormat"
        [maxFileSize]="maxFileSize"
        chooseLabel="Choose File"
        (onSelect)="onFileSelect($event)"
        [auto]="false">
      </p-fileupload>
      <small class="text-600 block mt-1 small-font">
        Supported formats: CSV. Maximum file size: 2MB
      </small>
      <small
        class="p-error block"
        *ngIf="formGroup.get('blacklistFile')?.invalid && formGroup.get('blacklistFile')?.touched">
        File is required for bulk import
      </small>
    </div>

    <!-- Form Actions -->
    <div class="flex col-12 justify-content-end gap-2 mt-4">
      <p-button
        type="submit"
        [label]="submitButtonLabel"
        icon="pi pi-check"
        [disabled]="formGroup.invalid"
        styleClass="p-button-primary">
      </p-button>

      <p-button
        type="button"
        label="Cancel"
        icon="pi pi-times"
        styleClass="p-button-secondary"
        (onClick)="onCancel()">
      </p-button>
    </div>
  </div>
</form>

<!-- Loading State -->
<div *ngIf="!formGroup" class="flex justify-content-center align-items-center" style="height: 200px;">
  <p-progressSpinner></p-progressSpinner>
</div>
