<form *ngIf="formGroup" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
  <div class="flex flex-column gap-3">
    <!-- Username -->
    <div class="field">
      <label for="username" class="block text-900 font-medium mb-2">
        Username <span class="text-red-500">*</span>
      </label>
      <input
        id="username"
        class="w-full"
        type="text"
        pInputText
        formControlName="username"
        placeholder="Enter username"
        [ngClass]="{'ng-invalid ng-dirty': isFieldInvalid('username')}">
      <small *ngIf="isFieldInvalid('username')" class="p-error">
        Username is required
      </small>
    </div>

    <!-- Password -->
    <div class="field">
      <label for="password" class="block text-900 font-medium mb-2">
        Password 
        <span *ngIf="isCreation" class="text-red-500">*</span>
        <span *ngIf="!isCreation" class="text-500">(leave blank to keep current)</span>
      </label>
      <p-password
        id="password"
        class="w-full"
        formControlName="password"
        placeholder="Enter password"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-full"
        inputStyleClass="w-full">
      </p-password>
      <small *ngIf="isFieldInvalid('password')" class="p-error">
        Password is required
      </small>
    </div>

    <!-- Email -->
    <div class="field">
      <label for="email" class="block text-900 font-medium mb-2">
        Email
      </label>
      <input
        id="email"
        class="w-full"
        type="email"
        pInputText
        formControlName="email"
        placeholder="Enter email"
        [ngClass]="{'ng-invalid ng-dirty': isFieldInvalid('email')}">
      <small *ngIf="isFieldInvalid('email')" class="p-error">
        Please enter a valid email
      </small>
    </div>

    <!-- Actions -->
    <div class="flex gap-2 justify-content-end mt-3">
      <p-button
        label="Cancel"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        (onClick)="onCancel()">
      </p-button>
      <p-button
        [label]="isCreation ? 'Create User' : 'Update User'"
        [icon]="isCreation ? 'pi pi-plus' : 'pi pi-check'"
        [loading]="isLoading"
        type="submit">
      </p-button>
    </div>
  </div>
</form>
