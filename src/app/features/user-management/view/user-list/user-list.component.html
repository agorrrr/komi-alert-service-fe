<div class="flex flex-column gap-2">
  <app-table-helper-lazy [data]="users" [objectName]="headerName" [totalRecord]="paginationData.totalRecord || 0"
    [fields]="fields" [acl]="permissions" [loadingData]="isLoading" (viewEvent)="onView($event)" (addEvent)="onAdd()"
    (updateEvent)="onUpdate($event)" (deleteEvent)="onDelete($event)" (paggingEvent)="onPaging($event)">
    <form slot="filtering" [formGroup]="filterFormGroup">
      <div class="grid">
        <!-- Username -->
        <div class="col-5">
          <label class="block text-900 font-medium mb-2">
            Username
          </label>
          <input class="w-full" type="text" pInputText formControlName="username" placeholder="Enter Username">
        </div>
        <!-- Email -->
        <div class="col-5">
          <label class="block text-900 font-medium mb-2">
            Email
          </label>
          <input class="w-full" type="text" pInputText formControlName="email" placeholder="Enter Email">
        </div>

        <!-- Filter Actions -->
        <div class="col-12">
          <div class="flex gap-2 justify-content-end">
            <p-button label="Reset" icon="pi pi-refresh" severity="secondary" [disabled]="isLoading" [outlined]="true">
            </p-button>
            <p-button label="Filter Data" icon="pi pi-search" [loading]="isLoading" type="submit">
            </p-button>
          </div>
        </div>
      </div>
    </form>
  </app-table-helper-lazy>
</div>

<p-dialog header="{{isCreation ? 'Add User' : 'Edit User'}}" [maximizable]="true" [(visible)]="modalVisibility"
  [style]="{width: '50vw'}" [modal]="true">
  <app-user-form [isCreation]="isCreation" (cbSuccess)="onSuccess()">
  </app-user-form>
</p-dialog>
