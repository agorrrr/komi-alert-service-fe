<form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
  
  <!-- Basic Fields (Always Visible) -->
  <div class="field">
    <label for="name" class="block font-medium text-900">Name (Optional)</label>
    <input pInputText id="name" formControlName="name" placeholder="e.g. Critical Error Alert" class="w-full" />
  </div>
  
  <div class="field">
    <label for="source_ids" class="block font-medium text-900">Sources</label>
    <p-multiSelect id="source_ids" 
                [options]="(state.sources$ | async)" 
                formControlName="source_ids" 
                optionLabel="name" 
                optionValue="id" 
                placeholder="Select sources" 
                class="w-full" 
                [style]="{'width':'100%'}"
                display="chip">
    </p-multiSelect>
  </div>

    <!-- Collapsible Advanced Section -->
  <div class="collapsible-section">
    <div class="collapsible-header" (click)="toggleAdvanced()" style="cursor: pointer; padding: 1rem; border: 1px solid #dee2e6; border-radius: 4px; background: #f8f9fa; display: flex; justify-content: space-between; align-items: center;">
      <span class="font-medium text-900">Advanced Configuration</span>
      <i [class]="isAdvancedOpen ? 'pi pi-chevron-up' : 'pi pi-chevron-down'"></i>
    </div>
    
    <div class="collapsible-content" *ngIf="isAdvancedOpen" [@slideDown] style="border: 1px solid #dee2e6; border-top: none; border-radius: 0 0 4px 4px; padding: 1rem; margin-top: -1px;">
      
      <!-- Filter Criteria Builder -->
      <div class="field">
        <div class="flex justify-content-between align-items-center mb-2">
          <label class="block font-medium text-900">Filter Criteria</label>
          <button pButton pRipple type="button" 
                  icon="pi pi-plus" 
                  label="Add Condition" 
                  class="p-button-sm p-button-outlined"
                  *ngIf="!formGroup.disabled"
                  (click)="addFilterCondition()"></button>
        </div>
        
     <div class="filter-builder" style="background: #f8f9fa; padding: 1rem; border-radius: 4px; border: 1px solid #dee2e6;">
  <div *ngIf="filterConditions.length === 0" class="text-center text-500 py-3">
    No filter conditions. Click "Add Condition" to create one.
  </div>
  
  <div *ngFor="let condition of filterConditions; let i = index; trackBy: trackByIndex" class="mb-3">
    <div class="flex align-items-start gap-2">

      <!-- Field Input -->
      <div class="flex-1">
        <label class="block text-sm mb-1">Field</label>
        <input pInputText 
               [(ngModel)]="filterConditions[i].field"
               [ngModelOptions]="{standalone: true}"
               [disabled]="formGroup.disabled"
               placeholder="e.g. severity, status, environment"
               class="w-full"
               (ngModelChange)="onFieldChange(i)" />
      </div>
      
      <!-- Values Section -->
      <div class="flex-3">
        <label class="block text-sm mb-1">Values (OR)</label>
        <div class="flex flex-column gap-2">
          <div *ngFor="let value of condition.values; let j = index; trackBy: trackByIndex" class="flex gap-2">
            <input pInputText 
                   [(ngModel)]="filterConditions[i].values[j]"
                   [ngModelOptions]="{standalone: true}"
                   [disabled]="formGroup.disabled"
                   placeholder="Enter value"
                   class="flex-1"
                   (ngModelChange)="onValueChange(i, j)" />
            <button pButton pRipple type="button" 
                    icon="pi pi-plus" 
                    class="p-button-sm  "
                    (click)="addValue(i)"
                    *ngIf="!formGroup.disabled && j === condition.values.length - 1"></button>
            <button pButton pRipple type="button" 
                    icon="pi pi-trash" 
                    class="p-button-sm p-button-danger"
                    (click)="removeValue(i, j)"
                    *ngIf="!formGroup.disabled && condition.values.length > 1"></button>
          </div>
        </div>
      </div>
      
      <!-- Remove Condition Button -->
      <div style="padding-top: 1.5rem;">
        <button pButton pRipple type="button" 
                icon="pi pi-times" 
                class="p-button-sm p-button-danger p-button-text"
                *ngIf="!formGroup.disabled"
                (click)="removeFilterCondition(i)"></button>
      </div>
    </div>
    
    <!-- AND Separator -->
    <div *ngIf="i < filterConditions.length - 1" class="text-center my-2">
      <div class="flex align-items-center my-2">
        <hr class="grow m-0" style="font-weight: 600; color: #2563EB;">
        <span class="px-3 py-1 mx-2" style="border-radius: 4px; font-weight: 600; color: #2563EB;">AND</span>
        <hr class="grow m-0"  style="font-weight: 600; color: #2563EB;">
      </div>
    </div>
  </div>
</div>
        
        <!-- Hidden form control to maintain form structure -->
        <input type="hidden" formControlName="filter_criteria" />
      </div>
      
      <!-- Message Template -->
      <div class="field mt-4">
        <div class="flex justify-content-between align-items-center mb-2">
          <label for="message_template" class="block font-medium text-900">Message Template</label>
          <button pButton pRipple type="button" 
                  [icon]="showPreview ? 'pi pi-eye-slash' : 'pi pi-eye'" 
                  [label]="showPreview ? 'Hide Preview' : 'Show Preview'" 
                  class="p-button-sm p-button-outlined"
                  (click)="togglePreview()"></button>
        </div>
        
        <textarea pInputTextarea 
                  [autoResize]="true"
                  id="message_template" 
                  formControlName="message_template" 
                  rows="8" 
                  class="w-full" 
                  style="min-height: 150px; resize: vertical;"
                  placeholder="🚨 <b>CRITICAL ALERT</b> 🚨\n\n📊 <b>{alert_name}</b>\n Rule: {rule_name}"
                  (ngModelChange)="showPreview && generatePreview()"></textarea>
        
        <!-- Preview Panel -->
        <div *ngIf="showPreview" [@slideDown] class="mt-3 p-3" style="background: #ffffff; border: 1px solid #dee2e6; border-radius: 4px;">
          <div class="flex justify-content-between align-items-center mb-2">
            <span class="font-semibold text-900">Preview</span>
            <span class="text-sm text-500">Variables with curly "{{'{alert_name}'}}" braces will be replaced with actual data</span>
          </div>
          <div class="preview-content p-3" style="background: #f8f9fa; border-radius: 4px; border: 1px solid #e9ecef;" 
               [innerHTML]="previewHtml"></div>
        </div>
      </div>
    </div>
  </div>
  
  
  <div class="field">
    <label for="destination_ids" class="block font-medium text-900">Destinations</label>
    <p-multiSelect id="destination_ids" 
                [options]="(state.destinations$ | async)" 
                formControlName="destination_ids" 
                optionLabel="name" 
                optionValue="id" 
                placeholder="Select destinations" 
                class="w-full" 
                [style]="{'width':'100%'}"
                display="chip">
    </p-multiSelect>
  </div>
  

  <div class="flex justify-content-end gap-2 mt-4">
    <button pButton pRipple type="button" label="Cancel" class="p-button-text" (click)="onCancel()"></button>
    <button pButton pRipple type="submit" label="Save" *ngIf="!formGroup.disabled" [loading]="state.isFormLoading" [disabled]="formGroup.invalid"></button>
  </div>
</form>
