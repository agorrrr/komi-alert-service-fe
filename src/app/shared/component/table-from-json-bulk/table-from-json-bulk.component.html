<p-table #dtTrx
    [resizableColumns]="true" 
    class="my-custom-datatable"
    [paginator]="true" 
    [rows]="10" 
    [rowsPerPageOptions]="[10, 25, 50 , 100]" 
    [showCurrentPageReport]="true" 
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    selectionMode="single" 
    styleClass="p-datatable-gridlines p-datatable-sm" 
    responsiveLayout="scroll" [value]="data"
    [globalFilterFields]="globalFilter"
    [rowsPerPageOptions]="[10, 25, 50,100]" [rows]="100">
    <ng-template pTemplate="caption">
        <div class="flex px-2 py-2">
            <h3 style="margin: 0; padding: 0;">{{listName}}</h3>
        </div>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <th *ngFor="let header of headers" [pSortableColumn]="header" id="header">
                <p-sortIcon [field]="header"></p-sortIcon>
                {{ header == 'no' ? 'No' : (formatCamelCaseString(header) | translate) }}
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
        <tr>
            <ng-container *ngFor="let column of headers; let i = index; let last = last">
                <td>
                    <label [for]="column">{{ mapingLabel(item,column,i) }}</label>
                </td>
            </ng-container>
        </tr>
    </ng-template>
</p-table>
