<p-table #dtTrx [value]="data" [scrollable]="true" scrollHeight="400px" class="p-2 tran-table" [paginator]="true"
    [showCurrentPageReport]="true" styleClass="p-datatable-striped"
    [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [showCurrentPageReport]="true"[globalFilterFields]="globalFilter"
    [rowsPerPageOptions]="[10, 25, 50,100]" [rows]="10">
    <ng-template pTemplate="caption">
        <div class="flex px-2 py-2">
            <h3 style="margin: 0; padding: 0;">Transactions Status</h3>
            <span class="p-input-icon-left ml-auto">
                <i class="pi pi-search"></i>
                <input pInputText type="text" (input)="dtTrx.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search..." />&nbsp;
            </span>

        </div>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <th [id]="header.key" *ngFor="let header of headers" [pSortableColumn]="header.realKey">
                {{ header.key |translate}}
                <p-sortIcon [field]="header.realKey"></p-sortIcon>
            </th>
            <th id="Actions">Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
        <tr>
            <ng-container *ngFor="let column of headers; let last = last">
                <td *ngIf="column.key !== 'Actions'">{{ item[column.realKey] }}</td>

            </ng-container>
            <td>
                <button pButton pRipple type="button" icon="pi pi-info-circle"
                    class="p-button-sm merapi-button p-1" (click)="onActionClick(item)"></button>
            </td>
        </tr>
    </ng-template>
</p-table>
