server {
    listen 14033;
    server_name _;

    root /usr/local/openresty/nginx/html/garda;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    #Set permissions for the Angular app folder
    location /usr/local/openresty/nginx/html/garda {
        internal;
        alias /usr/local/openresty/nginx/html/garda;
    }

    location /mgm {
        proxy_buffering off;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://10.114.40.54:35001/mgm; #kkt be
    }

    location /kkt-dashboard {
        proxy_buffering off;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://10.114.40.54:35001; #kkt
    }

    location /fds{
    proxy_set_header 'Access-Control-Allow-Origin' 'http://10.114.40.54:14033';
    proxy_hide_header X-Powered-By;
    proxy_pass_header Server;
    proxy_buffering off;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $http_host;

    proxy_pass http://10.114.40.54:35022;

    #Enhanced OPTIONS handling for WebSocket
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Methods 'GET,POST,DELETE,UPDATE,PUT,PATCH';
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie, Upgrade, Connection';
        add_header Access-Control-Allow-Origin 'http://10.114.40.54:14033';
        return 204;
      }
    }

    location /socket.io {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";

      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $http_host;

      proxy_pass http://10.114.40.54:35022;

      # Prevent buffering
      proxy_buffering off;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;

      # Handle CORS
      add_header Access-Control-Allow-Origin "http://10.114.40.54:14033" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      add_header Access-Control-Allow-Credentials "true" always;

      if ($request_method = OPTIONS) {
          return 204;
      }
    }

    location /management/report {
        #access_log /var/log/nginx/report_proxy.log proxy_log;  # Log file for management report proxy requests using custom format
        proxy_buffering off;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        #proxy_pass http://report_agent/report; #report-api
        proxy_pass http://10.114.40.54/report;
    }

    location /analytics {
        proxy_redirect  off;
        proxy_buffering off;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "Basic ZGFzaGJvYXJkX21vbml0b3Jpbmc6Qm5pMjAyMy4v";
        proxy_pass http://192.168.177.61:5601;
        #rewrite ^/analytics/(.*)$ /$1 break;
    }

    # Custom error pages
    error_page 403 404 405 /custom_404.html;
    location = /custom_404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        # Change the root directory if needed
    }
}

